# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m

# Performance and modern defaults
# Replaced deprecated android.dependency.excludeLibraryComponentsFromConstraints with suggested alternative
android.dependency.useConstraints=false

# Removed deprecated/non-default flags to match AGP 8.0+ defaults
# android.defaults.buildfeatures.resvalues=true -> now false by default
# android.sdk.defaultTargetSdkToCompileSdkIfUnset=false -> now true by default
# android.enableAppCompileTimeRClass=false -> now true by default
# android.usesSdkInManifest.disallowed=false -> now true by default
# android.r8.optimizedResourceShrinking=false -> now true by default
# android.builtInKotlin=false -> now true by default
# android.newDsl=false -> now true by default
